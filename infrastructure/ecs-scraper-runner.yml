AWSTemplateFormatVersion: "2010-09-09"
Description: origemlab scraper-runner on ECS Fargate (scheduled task)

Parameters:
  ProjectName:
    Type: String
    Default: origemlab
  EventBusName:
    Type: String
    Default: default
  ClusterName:
    Type: String
    Default: origemlab-scrapers
  RunnerImage:
    Type: String
    Description: "ECR image URI, e.g. 123.dkr.ecr.us-east-1.amazonaws.com/origemlab-scraper-runner:latest"
  ScheduleExpression:
    Type: String
    Default: "rate(1 hour)"
    Description: "EventBridge Scheduler expression"
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  SupabaseUrl:
    Type: String
    NoEcho: true
    Description: "Supabase project URL (injected at deploy from GitHub Actions secrets)"
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: "Supabase service role key (injected at deploy from GitHub Actions secrets)"

  # Opcionais: sobrescreva via GitHub Actions repository Variables (ver deploy-scraper-runner.yml)
  NodeDnsIpv4First:
    Type: String
    Default: "1"
    Description: "Se não vazio, ativa dns.setDefaultResultOrder('ipv4first') no Node (ver main.mjs)"
  ScraperFetchRetries:
    Type: String
    Default: "4"
  ScraperFetchConnectTimeoutMs:
    Type: String
    Default: "60000"
  ScraperFetchHeadersTimeoutMs:
    Type: String
    Default: "120000"
  ScraperFetchBodyTimeoutMs:
    Type: String
    Default: "120000"
  ScraperSourceTimeoutMs:
    Type: String
    Default: "300000"

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/scraper-runner"
      RetentionInDays: 14

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutOrigemlabEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-scraper-runner"
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: scraper-runner
          Image: !Ref RunnerImage
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: EVENT_BUS_NAME
              Value: !Ref EventBusName
            - Name: SUPABASE_URL
              Value: !Ref SupabaseUrl
            - Name: SUPABASE_SERVICE_ROLE_KEY
              Value: !Ref SupabaseServiceRoleKey
            - Name: NODE_DNS_IPV4FIRST
              Value: !Ref NodeDnsIpv4First
            - Name: SCRAPER_FETCH_RETRIES
              Value: !Ref ScraperFetchRetries
            - Name: SCRAPER_FETCH_CONNECT_TIMEOUT_MS
              Value: !Ref ScraperFetchConnectTimeoutMs
            - Name: SCRAPER_FETCH_HEADERS_TIMEOUT_MS
              Value: !Ref ScraperFetchHeadersTimeoutMs
            - Name: SCRAPER_FETCH_BODY_TIMEOUT_MS
              Value: !Ref ScraperFetchBodyTimeoutMs
            - Name: SCRAPER_SOURCE_TIMEOUT_MS
              Value: !Ref ScraperSourceTimeoutMs

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunEcsTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn

  ScraperSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-scraper-runner"
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: !Ref ScheduleExpression
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds

Outputs:
  EcsClusterName:
    Value: !Ref Cluster
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  ScheduleName:
    Value: !Ref ScraperSchedule

