AWSTemplateFormatVersion: "2010-09-09"
Description: >
  origemlab edital-pipeline on ECS Fargate — validate-editais-corretos primeiro, depois
  process-edital-info (default 0 editais). Um container; continuous = loop 24/7.

Parameters:
  ProjectName:
    Type: String
    Default: origemlab
  EventBusName:
    Type: String
    Default: default
  ClusterName:
    Type: String
    Default: origemlab-edital-pipeline
  ServiceImage:
    Type: String
    Description: "ECR image URI for edital-pipeline-service"
  ScheduleExpression:
    Type: String
    Default: "rate(1 hour)"
    Description: "EventBridge Scheduler quando OrchestrationMode=scheduled"
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  SupabaseUrl:
    Type: String
    NoEcho: true
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
  OllamaBaseUrl:
    Type: String
  OllamaModel:
    Type: String
    Default: "gemma2:2b"
  OllamaEmbedModel:
    Type: String
    Default: "mxbai-embed-large"
  OllamaTimeoutMs:
    Type: Number
    Default: 600000
  OllamaGenerateTimeoutMs:
    Type: Number
    Default: 900000
  OllamaEmbedTimeoutMs:
    Type: Number
    Default: 180000
  OllamaMaxContextChars:
    Type: Number
    Default: 6000
  ProcessEditalTopK:
    Type: Number
    Default: 40
    Description: "PROCESS_EDITAL_TOP_K global (timeline usa TOP_K_TIMELINE_ESTIMADA)"
  ProcessEditalTopKTimelineEstimada:
    Type: Number
    Default: 70
    Description: "Top-k para timeline_estimada (cronograma)"
  ProcessEditalFulldocMaxBatches:
    Type: Number
    Default: 50
    Description: "Máx. lotes na varredura sequencial; 0 = sem limite"
  ProcessEditalFulldocChunkScan:
    Type: Number
    Default: 1
    Description: "1 = varredura full-doc; 0 = só top-k + janelas"
  ProcessEditalUseWindows:
    Type: Number
    Default: 1
    Description: "1 = fallback por janelas após top-k"
  ProcessEditalGenerateDelayMs:
    Type: Number
    Default: 800
  ProcessEditalLimit:
    Type: Number
    Default: 0
  DelayBetweenEditaisMs:
    Type: Number
    Default: 0
  ProcessEditalConcurrency:
    Type: Number
    Default: 1
    Description: "1 evita saturar Ollama (segfault com paralelismo alto em CPU)"
  ProcessEditalFieldConcurrency:
    Type: Number
    Default: 1
  ValidateEditaisLimit:
    Type: Number
    Default: 0
  ValidateEditaisBatch:
    Type: Number
    Default: 200
  ApiRequestDelayMs:
    Type: Number
    Default: 0
  ValidateEditalConcurrency:
    Type: Number
    Default: 1
  ValidateFieldConcurrency:
    Type: Number
    Default: 1
  ValidateForceRevalidate:
    Type: Number
    Default: 0
  OrchestrationMode:
    Type: String
    Default: continuous
    AllowedValues:
      - continuous
      - scheduled
    Description: "continuous = 1 ECS Service 24/7; scheduled = só EventBridge Scheduler"
  WorkerIdleMsAfterWork:
    Type: Number
    Default: 8000
  WorkerIdleMsNoWork:
    Type: Number
    Default: 120000
  PipelineProcessLimit:
    Type: Number
    Default: 0
    Description: "Máx. editais na fase process após validate; 0 = só validate nesta iteração"

Conditions:
  IsContinuous: !Equals [!Ref OrchestrationMode, continuous]
  IsScheduled: !Equals [!Ref OrchestrationMode, scheduled]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/edital-pipeline"
      RetentionInDays: 14

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutOrigemlabEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-edital-pipeline"
      Cpu: "2048"
      Memory: "4096"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: edital-pipeline-service
          Image: !Ref ServiceImage
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: EVENT_BUS_NAME
              Value: !Ref EventBusName
            - Name: OLLAMA_BASE_URL
              Value: !Ref OllamaBaseUrl
            - Name: OLLAMA_MODEL
              Value: !Ref OllamaModel
            - Name: OLLAMA_EMBED_MODEL
              Value: !Ref OllamaEmbedModel
            - Name: OLLAMA_TIMEOUT_MS
              Value: !Ref OllamaTimeoutMs
            - Name: OLLAMA_GENERATE_TIMEOUT_MS
              Value: !Ref OllamaGenerateTimeoutMs
            - Name: OLLAMA_EMBED_TIMEOUT_MS
              Value: !Ref OllamaEmbedTimeoutMs
            - Name: OLLAMA_MAX_CONTEXT_CHARS
              Value: !Ref OllamaMaxContextChars
            - Name: PROCESS_EDITAL_TOP_K
              Value: !Ref ProcessEditalTopK
            - Name: PROCESS_EDITAL_TOP_K_TIMELINE_ESTIMADA
              Value: !Ref ProcessEditalTopKTimelineEstimada
            - Name: PROCESS_EDITAL_FULLDOC_MAX_BATCHES
              Value: !Ref ProcessEditalFulldocMaxBatches
            - Name: PROCESS_EDITAL_FULLDOC_CHUNK_SCAN
              Value: !Ref ProcessEditalFulldocChunkScan
            - Name: PROCESS_EDITAL_USE_WINDOWS
              Value: !Ref ProcessEditalUseWindows
            - Name: PROCESS_EDITAL_GENERATE_DELAY_MS
              Value: !Ref ProcessEditalGenerateDelayMs
            - Name: PROCESS_EDITAL_LIMIT
              Value: !Ref ProcessEditalLimit
            - Name: DELAY_BETWEEN_EDITAIS_MS
              Value: !Ref DelayBetweenEditaisMs
            - Name: PROCESS_EDITAL_CONCURRENCY
              Value: !Ref ProcessEditalConcurrency
            - Name: PROCESS_EDITAL_FIELD_CONCURRENCY
              Value: !Ref ProcessEditalFieldConcurrency
            - Name: VALIDATE_EDITAIS_LIMIT
              Value: !Ref ValidateEditaisLimit
            - Name: VALIDATE_EDITAIS_BATCH
              Value: !Ref ValidateEditaisBatch
            - Name: API_REQUEST_DELAY_MS
              Value: !Ref ApiRequestDelayMs
            - Name: VALIDATE_EDITAL_CONCURRENCY
              Value: !Ref ValidateEditalConcurrency
            - Name: VALIDATE_FIELD_CONCURRENCY
              Value: !Ref ValidateFieldConcurrency
            - Name: VALIDATE_FORCE_REVALIDATE
              Value: !Ref ValidateForceRevalidate
            - Name: PIPELINE_PROCESS_LIMIT
              Value: !Ref PipelineProcessLimit
            - Name: ECS_WORKER_LOOP
              Value: !If [IsContinuous, "1", "0"]
            - Name: WORKER_IDLE_MS_AFTER_WORK
              Value: !Sub "${WorkerIdleMsAfterWork}"
            - Name: WORKER_IDLE_MS_NO_WORK
              Value: !Sub "${WorkerIdleMsNoWork}"
            - Name: SUPABASE_URL
              Value: !Ref SupabaseUrl
            - Name: SUPABASE_SERVICE_ROLE_KEY
              Value: !Ref SupabaseServiceRoleKey

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunEcsTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn

  WorkerService:
    Condition: IsContinuous
    Type: AWS::ECS::Service
    DependsOn: TaskDefinition
    Properties:
      ServiceName: !Sub "${ProjectName}-edital-pipeline-worker"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 300
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: !Ref SecurityGroupIds
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 0
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  Schedule:
    Condition: IsScheduled
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-edital-pipeline"
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: !Ref ScheduleExpression
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds

Outputs:
  EcsClusterName:
    Value: !Ref Cluster
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  ScheduleName:
    Condition: IsScheduled
    Value: !Ref Schedule
  WorkerServiceName:
    Condition: IsContinuous
    Value: !GetAtt WorkerService.Name
