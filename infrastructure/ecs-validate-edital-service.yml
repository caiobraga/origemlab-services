AWSTemplateFormatVersion: "2010-09-09"
Description: origemlab validate-editais-corretos on ECS Fargate (validate extracted fields via Ollama → upsert editais_corretos)

Parameters:
  ProjectName:
    Type: String
    Default: origemlab
  ClusterName:
    Type: String
    Default: origemlab-validate-edital
  ServiceImage:
    Type: String
    Description: "ECR image URI for validate-edital-service"
  ScheduleExpression:
    Type: String
    Default: "rate(6 hours)"
    Description: "EventBridge Scheduler expression"
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  SupabaseUrl:
    Type: String
    NoEcho: true
    Description: "Supabase project URL (injected at deploy from GitHub Actions secrets)"
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: "Supabase service role key (injected at deploy from GitHub Actions secrets)"
  OllamaBaseUrl:
    Type: String
    Description: "Base URL do Ollama (ex.: http://host:11434)"
  OllamaModel:
    Type: String
    Default: "llama3.2:3b"
  OllamaTimeoutMs:
    Type: Number
    Default: 240000
  OllamaMaxContextChars:
    Type: Number
    Default: 22000
  ValidateEditaisLimit:
    Type: Number
    Default: 0
  ValidateEditaisBatch:
    Type: Number
    Default: 200
  ApiRequestDelayMs:
    Type: Number
    Default: 3000
  DelayBetweenEditaisMs:
    Type: Number
    Default: 6000
  OllamaEmbedModel:
    Type: String
    Default: "mxbai-embed-large:latest"
  ValidateForceRevalidate:
    Type: Number
    Default: 0
  OrchestrationMode:
    Type: String
    Default: continuous
    AllowedValues:
      - continuous
      - scheduled
  WorkerIdleMsAfterWork:
    Type: Number
    Default: 8000
  WorkerIdleMsNoWork:
    Type: Number
    Default: 120000

Conditions:
  IsContinuous: !Equals [!Ref OrchestrationMode, continuous]
  IsScheduled: !Equals [!Ref OrchestrationMode, scheduled]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/validate-edital"
      RetentionInDays: 14

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-validate-edital"
      Cpu: "2048"
      Memory: "4096"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: validate-edital-service
          Image: !Ref ServiceImage
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: OLLAMA_BASE_URL
              Value: !Ref OllamaBaseUrl
            - Name: OLLAMA_MODEL
              Value: !Ref OllamaModel
            - Name: OLLAMA_EMBED_MODEL
              Value: !Ref OllamaEmbedModel
            - Name: OLLAMA_TIMEOUT_MS
              Value: !Ref OllamaTimeoutMs
            - Name: OLLAMA_MAX_CONTEXT_CHARS
              Value: !Ref OllamaMaxContextChars
            - Name: VALIDATE_EDITAIS_LIMIT
              Value: !Ref ValidateEditaisLimit
            - Name: VALIDATE_EDITAIS_BATCH
              Value: !Ref ValidateEditaisBatch
            - Name: API_REQUEST_DELAY_MS
              Value: !Ref ApiRequestDelayMs
            - Name: DELAY_BETWEEN_EDITAIS_MS
              Value: !Ref DelayBetweenEditaisMs
            - Name: VALIDATE_FORCE_REVALIDATE
              Value: !Ref ValidateForceRevalidate
            - Name: ECS_WORKER_LOOP
              Value: !If [IsContinuous, "1", "0"]
            - Name: WORKER_IDLE_MS_AFTER_WORK
              Value: !Sub "${WorkerIdleMsAfterWork}"
            - Name: WORKER_IDLE_MS_NO_WORK
              Value: !Sub "${WorkerIdleMsNoWork}"
            - Name: SUPABASE_URL
              Value: !Ref SupabaseUrl
            - Name: SUPABASE_SERVICE_ROLE_KEY
              Value: !Ref SupabaseServiceRoleKey

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunEcsTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn

  WorkerService:
    Condition: IsContinuous
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-validate-edital-worker"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: !Ref SecurityGroupIds
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  Schedule:
    Condition: IsScheduled
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-validate-edital"
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: !Ref ScheduleExpression
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds

Outputs:
  EcsClusterName:
    Value: !Ref Cluster
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  ScheduleName:
    Condition: IsScheduled
    Value: !Ref Schedule
  WorkerServiceName:
    Condition: IsContinuous
    Value: !GetAtt WorkerService.Name

