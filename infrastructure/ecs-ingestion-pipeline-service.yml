AWSTemplateFormatVersion: "2010-09-09"
Description: >
  origemlab ingestion-pipeline — scraper-runner + document-processor num único container.
  Default scheduled (sem worker 24/7 do document-processor).

Parameters:
  ProjectName:
    Type: String
    Default: origemlab
  EventBusName:
    Type: String
    Default: default
  ClusterName:
    Type: String
    Default: origemlab-ingestion-pipeline
  ServiceImage:
    Type: String
    Description: "ECR image URI for ingestion-pipeline-service"
  ScheduleExpression:
    Type: String
    Default: "rate(1 hour)"
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  SupabaseUrl:
    Type: String
    NoEcho: true
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
  OllamaBaseUrl:
    Type: String
    Default: ""
  OllamaChatModel:
    Type: String
    Default: "qwen2.5:7b"
  OllamaEmbedModel:
    Type: String
    Default: "mxbai-embed-large:latest"
  NodeDnsIpv4First:
    Type: String
    Default: "1"
  ScraperFetchRetries:
    Type: String
    Default: "4"
  ScraperFetchConnectTimeoutMs:
    Type: String
    Default: "60000"
  ScraperFetchHeadersTimeoutMs:
    Type: String
    Default: "120000"
  ScraperFetchBodyTimeoutMs:
    Type: String
    Default: "120000"
  ScraperSourceTimeoutMs:
    Type: String
    Default: "300000"
  OrchestrationMode:
    Type: String
    Default: scheduled
    AllowedValues:
      - continuous
      - scheduled
  WorkerIdleMsAfterWork:
    Type: Number
    Default: 8000
  WorkerIdleMsNoWork:
    Type: Number
    Default: 120000

Conditions:
  HasOllamaUrl: !Not [!Equals [!Ref OllamaBaseUrl, ""]]
  IsContinuous: !Equals [!Ref OrchestrationMode, continuous]
  IsScheduled: !Equals [!Ref OrchestrationMode, scheduled]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/ingestion-pipeline"
      RetentionInDays: 14

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutOrigemlabEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-ingestion-pipeline"
      Cpu: "2048"
      Memory: "4096"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: ingestion-pipeline-service
          Image: !Ref ServiceImage
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment: !If
            - HasOllamaUrl
            - - Name: EVENT_BUS_NAME
                Value: !Ref EventBusName
              - Name: SUPABASE_URL
                Value: !Ref SupabaseUrl
              - Name: SUPABASE_SERVICE_ROLE_KEY
                Value: !Ref SupabaseServiceRoleKey
              - Name: OLLAMA_BASE_URL
                Value: !Ref OllamaBaseUrl
              - Name: OLLAMA_CHAT_MODEL
                Value: !Ref OllamaChatModel
              - Name: OLLAMA_EMBED_MODEL
                Value: !Ref OllamaEmbedModel
              - Name: NODE_DNS_IPV4FIRST
                Value: !Ref NodeDnsIpv4First
              - Name: SCRAPER_FETCH_RETRIES
                Value: !Ref ScraperFetchRetries
              - Name: SCRAPER_FETCH_CONNECT_TIMEOUT_MS
                Value: !Ref ScraperFetchConnectTimeoutMs
              - Name: SCRAPER_FETCH_HEADERS_TIMEOUT_MS
                Value: !Ref ScraperFetchHeadersTimeoutMs
              - Name: SCRAPER_FETCH_BODY_TIMEOUT_MS
                Value: !Ref ScraperFetchBodyTimeoutMs
              - Name: SCRAPER_SOURCE_TIMEOUT_MS
                Value: !Ref ScraperSourceTimeoutMs
              - Name: SCRAPER_SOURCE
                Value: "all"
              - Name: ECS_WORKER_LOOP
                Value: !If [IsContinuous, "1", "0"]
              - Name: WORKER_IDLE_MS_AFTER_WORK
                Value: !Sub "${WorkerIdleMsAfterWork}"
              - Name: WORKER_IDLE_MS_NO_WORK
                Value: !Sub "${WorkerIdleMsNoWork}"
            - - Name: EVENT_BUS_NAME
                Value: !Ref EventBusName
              - Name: SUPABASE_URL
                Value: !Ref SupabaseUrl
              - Name: SUPABASE_SERVICE_ROLE_KEY
                Value: !Ref SupabaseServiceRoleKey
              - Name: OLLAMA_CHAT_MODEL
                Value: !Ref OllamaChatModel
              - Name: OLLAMA_EMBED_MODEL
                Value: !Ref OllamaEmbedModel
              - Name: NODE_DNS_IPV4FIRST
                Value: !Ref NodeDnsIpv4First
              - Name: SCRAPER_FETCH_RETRIES
                Value: !Ref ScraperFetchRetries
              - Name: SCRAPER_FETCH_CONNECT_TIMEOUT_MS
                Value: !Ref ScraperFetchConnectTimeoutMs
              - Name: SCRAPER_FETCH_HEADERS_TIMEOUT_MS
                Value: !Ref ScraperFetchHeadersTimeoutMs
              - Name: SCRAPER_FETCH_BODY_TIMEOUT_MS
                Value: !Ref ScraperFetchBodyTimeoutMs
              - Name: SCRAPER_SOURCE_TIMEOUT_MS
                Value: !Ref ScraperSourceTimeoutMs
              - Name: SCRAPER_SOURCE
                Value: "all"
              - Name: ECS_WORKER_LOOP
                Value: !If [IsContinuous, "1", "0"]
              - Name: WORKER_IDLE_MS_AFTER_WORK
                Value: !Sub "${WorkerIdleMsAfterWork}"
              - Name: WORKER_IDLE_MS_NO_WORK
                Value: !Sub "${WorkerIdleMsNoWork}"

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunEcsTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn

  WorkerService:
    Condition: IsContinuous
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-ingestion-pipeline-worker"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: !Ref SecurityGroupIds
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  Schedule:
    Condition: IsScheduled
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-ingestion-pipeline"
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: !Ref ScheduleExpression
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              Subnets: !Ref SubnetIds
              SecurityGroups: !Ref SecurityGroupIds

Outputs:
  EcsClusterName:
    Value: !Ref Cluster
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  ScheduleName:
    Condition: IsScheduled
    Value: !Ref Schedule
  WorkerServiceName:
    Condition: IsContinuous
    Value: !GetAtt WorkerService.Name
