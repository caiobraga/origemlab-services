# ECS deploy: validate-edital-service (validate extracted fields via Ollama → upsert editais_corretos).
#
# Required repo variables:
#   VALIDATE_EDITAL_STACK_NAME             hyphens only (e.g. origemlab-validate-edital)
#   VPC_ID
#   SUBNET_IDS
#   SECURITY_GROUP_IDS
# Required GitHub Actions repository secrets (same names as .env):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
# Optional (same names as .env):
#   OLLAMA_BASE_URL
#   OLLAMA_MODEL
#   VALIDATE_EDITAL_OLLAMA_MODEL         se definida, sobrescreve OLLAMA_MODEL só neste deploy
#   OLLAMA_TIMEOUT_MS
#   OLLAMA_MAX_CONTEXT_CHARS
#   VALIDATE_EDITAIS_LIMIT
#   VALIDATE_EDITAIS_BATCH
#   API_REQUEST_DELAY_MS
#   DELAY_BETWEEN_EDITAIS_MS
#   VALIDATE_FORCE_REVALIDATE
#   VALIDATE_EDITAL_SCHEDULE_EXPRESSION (default rate(6 hours); só com OrchestrationMode=scheduled)
#   VALIDATE_EDITAL_CLUSTER_NAME (default origemlab-validate-edital)
#   OLLAMA_EMBED_MODEL (recomendado; mesmo do document-processor)
#   ECS_ORCHESTRATION_MODE (default continuous)
#   WORKER_IDLE_MS_AFTER_WORK / WORKER_IDLE_MS_NO_WORK (opcional)
name: deploy-validate-edital-service

on:
  push:
    branches: [main]
    paths:
      - "services/validate-edital-service/**"
      - "infrastructure/ecs-validate-edital-service.yml"
      - ".github/workflows/deploy-validate-edital-service.yml"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: validate-edital-service-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  docker-ecr-and-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Verify ECR repository
        run: |
          set -euo pipefail
          REPO="origemlab-validate-edital-service"
          if ! aws ecr describe-repositories --repository-names "${REPO}" --region "${AWS_REGION}" >/dev/null; then
            echo "ECR repository ${REPO} not found. Create it in the ECR console before deploying."
            exit 1
          fi
          echo "OK: ECR repository ${REPO}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: services/validate-edital-service
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE="${REGISTRY}/origemlab-validate-edital-service"
          docker build -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"
          echo "IMAGE_URI=${IMAGE}:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "Built and pushed ${IMAGE}:${IMAGE_TAG}"

      - name: Deploy ECS stack (CloudFormation)
        env:
          STACK_NAME: ${{ vars.VALIDATE_EDITAL_STACK_NAME }}
          VPC_ID: ${{ vars.VPC_ID }}
          SUBNET_IDS: ${{ vars.SUBNET_IDS }}
          SECURITY_GROUP_IDS: ${{ vars.SECURITY_GROUP_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          SCHEDULE_EXPRESSION: ${{ vars.VALIDATE_EDITAL_SCHEDULE_EXPRESSION }}
          CLUSTER_NAME: ${{ vars.VALIDATE_EDITAL_CLUSTER_NAME }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          VALIDATE_EDITAL_OLLAMA_MODEL: ${{ vars.VALIDATE_EDITAL_OLLAMA_MODEL }}
          OLLAMA_TIMEOUT_MS: ${{ vars.OLLAMA_TIMEOUT_MS }}
          OLLAMA_MAX_CONTEXT_CHARS: ${{ vars.OLLAMA_MAX_CONTEXT_CHARS }}
          VALIDATE_EDITAIS_LIMIT: ${{ vars.VALIDATE_EDITAIS_LIMIT }}
          VALIDATE_EDITAIS_BATCH: ${{ vars.VALIDATE_EDITAIS_BATCH }}
          API_REQUEST_DELAY_MS: ${{ vars.API_REQUEST_DELAY_MS }}
          DELAY_BETWEEN_EDITAIS_MS: ${{ vars.DELAY_BETWEEN_EDITAIS_MS }}
          VALIDATE_FORCE_REVALIDATE: ${{ vars.VALIDATE_FORCE_REVALIDATE }}
          OLLAMA_EMBED_MODEL: ${{ vars.OLLAMA_EMBED_MODEL }}
          ECS_ORCHESTRATION_MODE: ${{ vars.ECS_ORCHESTRATION_MODE }}
          WORKER_IDLE_MS_AFTER_WORK: ${{ vars.WORKER_IDLE_MS_AFTER_WORK }}
          WORKER_IDLE_MS_NO_WORK: ${{ vars.WORKER_IDLE_MS_NO_WORK }}
        run: |
          set -euo pipefail
          : "${STACK_NAME:?Set repo variable VALIDATE_EDITAL_STACK_NAME}"
          STACK_NAME="$(bash .github/scripts/normalize-cloudformation-stack-name.sh "${STACK_NAME}")"
          : "${VPC_ID:?Set repo variable VPC_ID}"
          : "${SUBNET_IDS:?Set repo variable SUBNET_IDS}"
          : "${SECURITY_GROUP_IDS:?Set repo variable SECURITY_GROUP_IDS}"
          : "${SUPABASE_URL:?Set repo secret SUPABASE_URL}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?Set repo secret SUPABASE_SERVICE_ROLE_KEY}"
          : "${OLLAMA_BASE_URL:?Set repo variable OLLAMA_BASE_URL}"
          : "${IMAGE_URI:?IMAGE_URI missing after ECR push}"

          escape_cf_list() { printf '%s' "$1" | sed 's/,/\\,/g'; }
          SUBNET_IDS_CF=$(escape_cf_list "${SUBNET_IDS}")
          SG_IDS_CF=$(escape_cf_list "${SECURITY_GROUP_IDS}")

          SCHED="${SCHEDULE_EXPRESSION:-rate(6 hours)}"
          CLUSTER="${CLUSTER_NAME:-origemlab-validate-edital}"
          ORCH="${ECS_ORCHESTRATION_MODE:-continuous}"

          OVERRIDES=(
            "ServiceImage=${IMAGE_URI}"
            "VpcId=${VPC_ID}"
            "SubnetIds=${SUBNET_IDS_CF}"
            "SecurityGroupIds=${SG_IDS_CF}"
            "SupabaseUrl=${SUPABASE_URL}"
            "SupabaseServiceRoleKey=${SUPABASE_SERVICE_ROLE_KEY}"
            "OllamaBaseUrl=${OLLAMA_BASE_URL}"
            "ScheduleExpression=${SCHED}"
            "ClusterName=${CLUSTER}"
            "OrchestrationMode=${ORCH}"
          )

          _val_ollama="$(printf '%s' "${VALIDATE_EDITAL_OLLAMA_MODEL:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          _shared_ollama="$(printf '%s' "${OLLAMA_MODEL:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          _ollama_effective="${_val_ollama:-${_shared_ollama}}"
          _ollama_effective="${_ollama_effective:-qwen2.5:14b}"
          OVERRIDES+=("OllamaModel=${_ollama_effective}")
          echo "CloudFormation parameter OllamaModel=${_ollama_effective} (VALIDATE_EDITAL_OLLAMA_MODEL > OLLAMA_MODEL > default)"

          if [ -n "${OLLAMA_EMBED_MODEL:-}" ]; then
            OVERRIDES+=("OllamaEmbedModel=${OLLAMA_EMBED_MODEL}")
          fi
          if [ -n "${OLLAMA_TIMEOUT_MS:-}" ]; then
            OVERRIDES+=("OllamaTimeoutMs=${OLLAMA_TIMEOUT_MS}")
          fi
          if [ -n "${OLLAMA_MAX_CONTEXT_CHARS:-}" ]; then
            OVERRIDES+=("OllamaMaxContextChars=${OLLAMA_MAX_CONTEXT_CHARS}")
          fi
          if [ -n "${VALIDATE_EDITAIS_LIMIT:-}" ]; then
            OVERRIDES+=("ValidateEditaisLimit=${VALIDATE_EDITAIS_LIMIT}")
          fi
          if [ -n "${VALIDATE_EDITAIS_BATCH:-}" ]; then
            OVERRIDES+=("ValidateEditaisBatch=${VALIDATE_EDITAIS_BATCH}")
          fi
          if [ -n "${API_REQUEST_DELAY_MS:-}" ]; then
            OVERRIDES+=("ApiRequestDelayMs=${API_REQUEST_DELAY_MS}")
          fi
          if [ -n "${DELAY_BETWEEN_EDITAIS_MS:-}" ]; then
            OVERRIDES+=("DelayBetweenEditaisMs=${DELAY_BETWEEN_EDITAIS_MS}")
          fi
          if [ -n "${VALIDATE_FORCE_REVALIDATE:-}" ]; then
            OVERRIDES+=("ValidateForceRevalidate=${VALIDATE_FORCE_REVALIDATE}")
          fi
          if [ -n "${WORKER_IDLE_MS_AFTER_WORK:-}" ]; then
            OVERRIDES+=("WorkerIdleMsAfterWork=${WORKER_IDLE_MS_AFTER_WORK}")
          fi
          if [ -n "${WORKER_IDLE_MS_NO_WORK:-}" ]; then
            OVERRIDES+=("WorkerIdleMsNoWork=${WORKER_IDLE_MS_NO_WORK}")
          fi

          if ! aws cloudformation deploy \
            --template-file infrastructure/ecs-validate-edital-service.yml \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${OVERRIDES[@]}"; then
            echo ""
            echo "CloudFormation deploy failed. FAILED events (check ResourceStatusReason):"
            aws cloudformation describe-stack-events \
              --stack-name "${STACK_NAME}" \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`DELETE_FAILED`].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
              --output table 2>/dev/null || true
            echo ""
            echo "Most recent stack events (up to 35):"
            aws cloudformation describe-stack-events \
              --stack-name "${STACK_NAME}" \
              --max-items 35 \
              --output table 2>/dev/null || true
            exit 1
          fi

          echo "Stack ${STACK_NAME} updated; ServiceImage=${IMAGE_URI}"

          bash .github/scripts/ecs-force-rollout-after-cfn.sh "${STACK_NAME}" "${ORCH}"

