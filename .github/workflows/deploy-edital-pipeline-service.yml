# ECS deploy: edital-pipeline (process-edital + validate-edital num único container).
# Edital pipeline: default continuous (1 ECS Service). Agendado: EDITAL_PIPELINE_ORCHESTRATION_MODE=scheduled
#
# Required repo variables:
#   EDITAL_PIPELINE_STACK_NAME   optional (default origemlab-edital-pipeline)
#   VPC_ID, SUBNET_IDS, SECURITY_GROUP_IDS
#   OLLAMA_BASE_URL
# Optional:
#   EDITAL_PIPELINE_SCHEDULE_EXPRESSION (default rate(1 hour))
#   EDITAL_PIPELINE_CLUSTER_NAME (default origemlab-edital-pipeline)
#   EDITAL_PIPELINE_ORCHESTRATION_MODE (default continuous; scheduled para só EventBridge)
#   EVENT_BUS_NAME, OLLAMA_MODEL, PROCESS_EDITAL_*, VALIDATE_*, etc. (mesmas dos stacks antigos)
name: deploy-edital-pipeline-service

on:
  # Push desativado: use deploy-all-ecs-services (ambas pipelines) ou workflow_dispatch aqui.
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: edital-pipeline-service-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  docker-ecr-and-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Ensure ECR repository exists
        run: bash .github/scripts/ensure-ecr-repository.sh origemlab-edital-pipeline-service

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE="${REGISTRY}/origemlab-edital-pipeline-service"
          docker build -f services/edital-pipeline-service/Dockerfile -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"
          echo "IMAGE_URI=${IMAGE}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Deploy ECS stack (CloudFormation)
        env:
          STACK_NAME: ${{ vars.EDITAL_PIPELINE_STACK_NAME }}
          VPC_ID: ${{ vars.VPC_ID }}
          SUBNET_IDS: ${{ vars.SUBNET_IDS }}
          SECURITY_GROUP_IDS: ${{ vars.SECURITY_GROUP_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          SCHEDULE_EXPRESSION: ${{ vars.EDITAL_PIPELINE_SCHEDULE_EXPRESSION }}
          CLUSTER_NAME: ${{ vars.EDITAL_PIPELINE_CLUSTER_NAME }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          PROCESS_EDITAL_OLLAMA_MODEL: ${{ vars.PROCESS_EDITAL_OLLAMA_MODEL }}
          OLLAMA_TIMEOUT_MS: ${{ vars.OLLAMA_TIMEOUT_MS }}
          OLLAMA_GENERATE_TIMEOUT_MS: ${{ vars.OLLAMA_GENERATE_TIMEOUT_MS }}
          PROCESS_EDITAL_OLLAMA_GENERATE_TIMEOUT_MS: ${{ vars.PROCESS_EDITAL_OLLAMA_GENERATE_TIMEOUT_MS }}
          OLLAMA_EMBED_TIMEOUT_MS: ${{ vars.OLLAMA_EMBED_TIMEOUT_MS }}
          PROCESS_EDITAL_OLLAMA_EMBED_TIMEOUT_MS: ${{ vars.PROCESS_EDITAL_OLLAMA_EMBED_TIMEOUT_MS }}
          OLLAMA_MAX_CONTEXT_CHARS: ${{ vars.OLLAMA_MAX_CONTEXT_CHARS }}
          PROCESS_EDITAL_TOP_K: ${{ vars.PROCESS_EDITAL_TOP_K }}
          PROCESS_EDITAL_TOP_K_TIMELINE_ESTIMADA: ${{ vars.PROCESS_EDITAL_TOP_K_TIMELINE_ESTIMADA }}
          PROCESS_EDITAL_FULLDOC_MAX_BATCHES: ${{ vars.PROCESS_EDITAL_FULLDOC_MAX_BATCHES }}
          PROCESS_EDITAL_FULLDOC_CHUNK_SCAN: ${{ vars.PROCESS_EDITAL_FULLDOC_CHUNK_SCAN }}
          PROCESS_EDITAL_USE_WINDOWS: ${{ vars.PROCESS_EDITAL_USE_WINDOWS }}
          PROCESS_EDITAL_GENERATE_DELAY_MS: ${{ vars.PROCESS_EDITAL_GENERATE_DELAY_MS }}
          PROCESS_EDITAL_LIMIT: ${{ vars.PROCESS_EDITAL_LIMIT }}
          DELAY_BETWEEN_EDITAIS_MS: ${{ vars.DELAY_BETWEEN_EDITAIS_MS }}
          PROCESS_EDITAL_CONCURRENCY: ${{ vars.PROCESS_EDITAL_CONCURRENCY }}
          PROCESS_EDITAL_FIELD_CONCURRENCY: ${{ vars.PROCESS_EDITAL_FIELD_CONCURRENCY }}
          VALIDATE_EDITAIS_LIMIT: ${{ vars.VALIDATE_EDITAIS_LIMIT }}
          VALIDATE_EDITAIS_BATCH: ${{ vars.VALIDATE_EDITAIS_BATCH }}
          API_REQUEST_DELAY_MS: ${{ vars.VALIDATE_API_REQUEST_DELAY_MS }}
          VALIDATE_EDITAL_CONCURRENCY: ${{ vars.VALIDATE_EDITAL_CONCURRENCY }}
          VALIDATE_FIELD_CONCURRENCY: ${{ vars.VALIDATE_FIELD_CONCURRENCY }}
          EDITAL_PIPELINE_ORCHESTRATION_MODE: ${{ vars.EDITAL_PIPELINE_ORCHESTRATION_MODE }}
          WORKER_IDLE_MS_AFTER_WORK: ${{ vars.WORKER_IDLE_MS_AFTER_WORK }}
          WORKER_IDLE_MS_NO_WORK: ${{ vars.WORKER_IDLE_MS_NO_WORK }}
          EVENT_BUS_NAME: ${{ vars.EVENT_BUS_NAME }}
        run: |
          set -euo pipefail
          STACK_NAME="${STACK_NAME:-origemlab-edital-pipeline}"
          STACK_NAME="$(bash .github/scripts/normalize-cloudformation-stack-name.sh "${STACK_NAME}")"
          echo "CloudFormation stack: ${STACK_NAME} (override: EDITAL_PIPELINE_STACK_NAME)"
          : "${VPC_ID:?Set repo variable VPC_ID}"
          : "${SUBNET_IDS:?Set repo variable SUBNET_IDS}"
          : "${SECURITY_GROUP_IDS:?Set repo variable SECURITY_GROUP_IDS}"
          : "${SUPABASE_URL:?Set repo secret SUPABASE_URL}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?Set repo secret SUPABASE_SERVICE_ROLE_KEY}"
          : "${OLLAMA_BASE_URL:?Set repo variable OLLAMA_BASE_URL}"
          : "${IMAGE_URI:?IMAGE_URI missing}"

          escape_cf_list() { printf '%s' "$1" | sed 's/,/\\,/g'; }
          SUBNET_IDS_CF=$(escape_cf_list "${SUBNET_IDS}")
          SG_IDS_CF=$(escape_cf_list "${SECURITY_GROUP_IDS}")

          SCHED="${SCHEDULE_EXPRESSION:-rate(1 hour)}"
          CLUSTER="${CLUSTER_NAME:-origemlab-edital-pipeline}"
          ORCH="${EDITAL_PIPELINE_ORCHESTRATION_MODE:-continuous}"
          EB="${EVENT_BUS_NAME:-default}"
          echo "OrchestrationMode=${ORCH} (continuous = ECS Service 24/7; scheduled = 0 services + EventBridge)"

          bash .github/scripts/cfn-delete-failed-stack.sh "${STACK_NAME}"

          OVERRIDES=(
            "ServiceImage=${IMAGE_URI}"
            "VpcId=${VPC_ID}"
            "SubnetIds=${SUBNET_IDS_CF}"
            "SecurityGroupIds=${SG_IDS_CF}"
            "SupabaseUrl=${SUPABASE_URL}"
            "SupabaseServiceRoleKey=${SUPABASE_SERVICE_ROLE_KEY}"
            "OllamaBaseUrl=${OLLAMA_BASE_URL}"
            "ScheduleExpression=${SCHED}"
            "ClusterName=${CLUSTER}"
            "OrchestrationMode=${ORCH}"
            "EventBusName=${EB}"
          )

          _proc_ollama="$(printf '%s' "${PROCESS_EDITAL_OLLAMA_MODEL:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          _shared_ollama="$(printf '%s' "${OLLAMA_MODEL:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          _ollama_effective="${_proc_ollama:-${_shared_ollama}}"
          _ollama_effective="${_ollama_effective:-gemma2:2b}"
          OVERRIDES+=("OllamaModel=${_ollama_effective}")

          _ctx_chars="$(printf '%s' "${OLLAMA_MAX_CONTEXT_CHARS:-10000}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "${_ctx_chars}" =~ ^[0-9]+$ ]] || _ctx_chars=10000
          OVERRIDES+=("OllamaMaxContextChars=${_ctx_chars}")

          _topk="$(printf '%s' "${PROCESS_EDITAL_TOP_K:-40}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "${_topk}" =~ ^[0-9]+$ ]] || _topk=40
          OVERRIDES+=("ProcessEditalTopK=${_topk}")

          _topk_tl="$(printf '%s' "${PROCESS_EDITAL_TOP_K_TIMELINE_ESTIMADA:-70}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "${_topk_tl}" =~ ^[0-9]+$ ]] || _topk_tl=70
          OVERRIDES+=("ProcessEditalTopKTimelineEstimada=${_topk_tl}")

          _fd_batches="$(printf '%s' "${PROCESS_EDITAL_FULLDOC_MAX_BATCHES:-50}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "${_fd_batches}" =~ ^[0-9]+$ ]] || _fd_batches=50
          OVERRIDES+=("ProcessEditalFulldocMaxBatches=${_fd_batches}")

          _fd_scan="$(printf '%s' "${PROCESS_EDITAL_FULLDOC_CHUNK_SCAN:-1}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "${_fd_scan}" =~ ^[01]$ ]] || _fd_scan=1
          OVERRIDES+=("ProcessEditalFulldocChunkScan=${_fd_scan}")

          _use_win="$(printf '%s' "${PROCESS_EDITAL_USE_WINDOWS:-1}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "${_use_win}" =~ ^[01]$ ]] || _use_win=1
          OVERRIDES+=("ProcessEditalUseWindows=${_use_win}")

          _gen_delay="$(printf '%s' "${PROCESS_EDITAL_GENERATE_DELAY_MS:-800}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "${_gen_delay}" =~ ^[0-9]+$ ]] || _gen_delay=800
          OVERRIDES+=("ProcessEditalGenerateDelayMs=${_gen_delay}")

          _timeout_eff="$(printf '%s' "${OLLAMA_TIMEOUT_MS:-600000}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "${_timeout_eff}" =~ ^[0-9]+$ ]] || _timeout_eff=600000
          OVERRIDES+=("OllamaTimeoutMs=${_timeout_eff}")

          _gen_proc="$(printf '%s' "${PROCESS_EDITAL_OLLAMA_GENERATE_TIMEOUT_MS:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          _gen_shared="$(printf '%s' "${OLLAMA_GENERATE_TIMEOUT_MS:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          _gen_eff="${_gen_proc:-${_gen_shared}}"
          _gen_eff="${_gen_eff:-900000}"
          [[ "${_gen_eff}" =~ ^[0-9]+$ ]] || _gen_eff=900000
          OVERRIDES+=("OllamaGenerateTimeoutMs=${_gen_eff}")

          _emb_proc="$(printf '%s' "${PROCESS_EDITAL_OLLAMA_EMBED_TIMEOUT_MS:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          _emb_shared="$(printf '%s' "${OLLAMA_EMBED_TIMEOUT_MS:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          _emb_eff="${_emb_proc:-${_emb_shared}}"
          _emb_eff="${_emb_eff:-180000}"
          [[ "${_emb_eff}" =~ ^[0-9]+$ ]] || _emb_eff=180000
          OVERRIDES+=("OllamaEmbedTimeoutMs=${_emb_eff}")

          [ -n "${PROCESS_EDITAL_LIMIT:-}" ] && OVERRIDES+=("ProcessEditalLimit=${PROCESS_EDITAL_LIMIT}")
          [ -n "${DELAY_BETWEEN_EDITAIS_MS:-}" ] && OVERRIDES+=("DelayBetweenEditaisMs=${DELAY_BETWEEN_EDITAIS_MS}")
          [ -n "${PROCESS_EDITAL_CONCURRENCY:-}" ] && OVERRIDES+=("ProcessEditalConcurrency=${PROCESS_EDITAL_CONCURRENCY}")
          [ -n "${PROCESS_EDITAL_FIELD_CONCURRENCY:-}" ] && OVERRIDES+=("ProcessEditalFieldConcurrency=${PROCESS_EDITAL_FIELD_CONCURRENCY}")
          [ -n "${VALIDATE_EDITAIS_LIMIT:-}" ] && OVERRIDES+=("ValidateEditaisLimit=${VALIDATE_EDITAIS_LIMIT}")
          [ -n "${VALIDATE_EDITAIS_BATCH:-}" ] && OVERRIDES+=("ValidateEditaisBatch=${VALIDATE_EDITAIS_BATCH}")
          [ -n "${API_REQUEST_DELAY_MS:-}" ] && OVERRIDES+=("ApiRequestDelayMs=${API_REQUEST_DELAY_MS}")
          [ -n "${VALIDATE_EDITAL_CONCURRENCY:-}" ] && OVERRIDES+=("ValidateEditalConcurrency=${VALIDATE_EDITAL_CONCURRENCY}")
          [ -n "${VALIDATE_FIELD_CONCURRENCY:-}" ] && OVERRIDES+=("ValidateFieldConcurrency=${VALIDATE_FIELD_CONCURRENCY}")
          [ -n "${WORKER_IDLE_MS_AFTER_WORK:-}" ] && OVERRIDES+=("WorkerIdleMsAfterWork=${WORKER_IDLE_MS_AFTER_WORK}")
          [ -n "${WORKER_IDLE_MS_NO_WORK:-}" ] && OVERRIDES+=("WorkerIdleMsNoWork=${WORKER_IDLE_MS_NO_WORK}")

          if ! aws cloudformation deploy \
            --template-file infrastructure/ecs-edital-pipeline-service.yml \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${OVERRIDES[@]}"; then
            echo ""
            echo "=== CloudFormation failure: ${STACK_NAME} ==="
            aws cloudformation describe-stack-events \
              --stack-name "${STACK_NAME}" \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`DELETE_FAILED`].[LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
              --output table 2>/dev/null || true
            echo ""
            echo "Dica: modo continuous precisa de ecs:CreateService + iam:PassRole no papel GithubActions (README secao IAM)."
            echo "Se o stack ficou em ROLLBACK_COMPLETE, o proximo run apaga-o com cfn-delete-failed-stack.sh."
            exit 1
          fi

          bash .github/scripts/ecs-force-rollout-after-cfn.sh "${STACK_NAME}" "${ORCH}"

      - name: Run pipeline task once (scheduled mode has no ECS Service)
        env:
          STACK_NAME: ${{ vars.EDITAL_PIPELINE_STACK_NAME }}
          SUBNET_IDS: ${{ vars.SUBNET_IDS }}
          SECURITY_GROUP_IDS: ${{ vars.SECURITY_GROUP_IDS }}
          ECS_RUN_TASK_AFTER_DEPLOY: ${{ vars.ECS_RUN_TASK_AFTER_DEPLOY }}
        run: |
          set -euo pipefail
          if [ "${ECS_RUN_TASK_AFTER_DEPLOY:-false}" = "false" ]; then
            echo "ECS_RUN_TASK_AFTER_DEPLOY=false — skip run-task."
            exit 0
          fi
          STACK_NAME="${STACK_NAME:-origemlab-edital-pipeline}"
          STACK_NAME="$(bash .github/scripts/normalize-cloudformation-stack-name.sh "${STACK_NAME}")"
          bash .github/scripts/ecs-run-pipeline-task-once.sh "${STACK_NAME}" "${SUBNET_IDS}" "${SECURITY_GROUP_IDS}"
