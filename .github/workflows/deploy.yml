# SAM deploy: small Go Lambdas (telegram-notifier, error-reporter). Not document-processor.
# Document processing: Docker → ECR → ECS Fargate (deploy-document-processor.yml).
#
# Required GitHub Actions repository secrets:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
# Optional:
#   TELEGRAM_ERROR_CHAT_ID
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: origemlab-services-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  STACK_NAME: ${{ vars.STACK_NAME }}
  EVENT_BUS_NAME: ${{ vars.EVENT_BUS_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Setup AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Tests
        run: go test ./...

      - name: SAM build
        run: sam build --cached

      - name: SAM deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
        run: |
          set -euo pipefail
          : "${TELEGRAM_BOT_TOKEN:?Set repo secret TELEGRAM_BOT_TOKEN}"
          : "${TELEGRAM_CHAT_ID:?Set repo secret TELEGRAM_CHAT_ID}"
          sam deploy \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "EventBusName=${EVENT_BUS_NAME:-default}" \
              "TelegramBotToken=${TELEGRAM_BOT_TOKEN}" \
              "TelegramChatId=${TELEGRAM_CHAT_ID}" \
              "TelegramErrorChatId=${TELEGRAM_ERROR_CHAT_ID:-}"

