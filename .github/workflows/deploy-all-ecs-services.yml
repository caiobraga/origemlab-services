# Entrypoint AWS: Ollama ECS (NLB) + unified-pipeline (scraper → document → process → validate).
# Stacks legados (ingestion/edital separados): só workflow_dispatch manual.
# SAM/Lambda: deploy.yml
name: deploy-all-ecs-services

on:
  workflow_dispatch:
    inputs:
      orchestration_mode:
        description: "continuous = worker 24/7 no ECS; scheduled = só EventBridge"
        required: false
        default: continuous
        type: choice
        options:
          - continuous
          - scheduled
  push:
    branches: [main]
    paths:
      - "services/unified-pipeline-service/**"
      - "services/ingestion-pipeline-service/**"
      - "services/edital-pipeline-service/**"
      - "services/scraper-runner/**"
      - "services/document-processor/**"
      - "services/process-edital-service/**"
      - "services/validate-edital-service/**"
      - "infrastructure/ecs-unified-pipeline-service.yml"
      - "scripts/**"
      - "services/ollama-service/**"
      - "infrastructure/ecs-ollama-service.yml"
      - ".github/workflows/deploy-ollama-service.yml"
      - ".github/workflows/deploy-unified-pipeline-service.yml"
      - ".github/workflows/deploy-all-ecs-services.yml"
      - ".github/scripts/ensure-ecr-repository.sh"
      - ".github/scripts/resolve-al2023-ami.sh"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-all-ecs-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ollama-service:
    uses: ./.github/workflows/deploy-ollama-service.yml
    secrets: inherit

  unified-pipeline-service:
    needs: ollama-service
    uses: ./.github/workflows/deploy-unified-pipeline-service.yml
    secrets: inherit
    with:
      orchestration_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.orchestration_mode || 'continuous' }}

  # Legado (deploy manual): deploy-ingestion-pipeline-service.yml, deploy-edital-pipeline-service.yml
