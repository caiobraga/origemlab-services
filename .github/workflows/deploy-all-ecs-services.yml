# Entrypoint AWS: Ollama EC2 + ingestion-pipeline + edital-pipeline (paralelo).
# Stacks legados ECS separados: só workflow_dispatch manual.
# SAM/Lambda: deploy.yml
name: deploy-all-ecs-services

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "services/ingestion-pipeline-service/**"
      - "services/edital-pipeline-service/**"
      - "services/scraper-runner/**"
      - "services/document-processor/**"
      - "services/process-edital-service/**"
      - "services/validate-edital-service/**"
      - "infrastructure/ecs-ingestion-pipeline-service.yml"
      - "infrastructure/ecs-edital-pipeline-service.yml"
      - "infrastructure/ec2-ollama-server.yml"
      - ".github/workflows/deploy-ollama-server.yml"
      - ".github/workflows/deploy-all-ecs-services.yml"
      - ".github/workflows/deploy-ingestion-pipeline-service.yml"
      - ".github/workflows/deploy-edital-pipeline-service.yml"
      - ".github/scripts/ensure-ecr-repository.sh"

permissions:
  contents: read
  id-token: write

jobs:
  ollama-server:
    uses: ./.github/workflows/deploy-ollama-server.yml
    secrets: inherit

  ingestion-pipeline-service:
    uses: ./.github/workflows/deploy-ingestion-pipeline-service.yml
    secrets: inherit

  edital-pipeline-service:
    uses: ./.github/workflows/deploy-edital-pipeline-service.yml
    secrets: inherit

  # Legado (deploy manual): deploy-scraper-runner.yml, deploy-document-processor.yml,
